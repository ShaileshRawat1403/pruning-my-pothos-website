name: Deploy to Hostinger

on:
  workflow_dispatch:

jobs:
  verify-manual-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:content
      - run: npm run lint:systems
      - run: npm run build
      - name: Manual upload reminder
        run: echo "FTP deploy disabled. Upload dist/ manually."
