<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Soothsayer MCP Kernel cover</title>
  <desc id="desc">Editorial cover with governance flow motif for deterministic MCP orchestration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.28" stroke="#334155" stroke-width="1">
    <path d="M120 180h960"/>
    <path d="M120 450h960"/>
    <path d="M300 120v390"/>
    <path d="M600 120v390"/>
    <path d="M900 120v390"/>
  </g>

  <g fill="#0b1220" stroke="#475569" stroke-width="2">
    <rect x="170" y="240" width="180" height="130" rx="16"/>
    <rect x="510" y="200" width="180" height="130" rx="16"/>
    <rect x="850" y="240" width="180" height="130" rx="16"/>
  </g>

  <g stroke="url(#signal)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M350 305h160"/>
    <path d="M690 265h160"/>
  </g>

  <g fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
    <text x="260" y="312" text-anchor="middle">Client</text>
    <text x="600" y="272" text-anchor="middle">Kernel</text>
    <text x="940" y="312" text-anchor="middle">Policy</text>
  </g>

  <g>
    <text x="120" y="92" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">
      Soothsayer MCP Kernel
    </text>
    <text x="120" y="132" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" letter-spacing="1">
      Deterministic orchestration, policy first
    </text>
  </g>

  <g fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <text x="120" y="565">RUN LIFECYCLE  ·  OWNER SCOPING  ·  BUNDLE HASHING  ·  CONTRACT FREEZE</text>
  </g>
</svg>
