<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Observability Logbook Pattern</title>
  <desc id="desc">Editorial cover with three connected panels: events, evidence, outcomes.</desc>
  <rect width="1200" height="630" fill="#f7f4ef"/>
  <rect x="80" y="86" width="1040" height="458" rx="28" fill="#fffdf9" stroke="#d6cec1" stroke-width="4"/>

  <rect x="140" y="190" width="260" height="180" rx="18" fill="none" stroke="#3a3a36" stroke-width="4"/>
  <rect x="470" y="190" width="260" height="180" rx="18" fill="none" stroke="#3a3a36" stroke-width="4"/>
  <rect x="800" y="190" width="260" height="180" rx="18" fill="#ef7d32" fill-opacity="0.12" stroke="#ef7d32" stroke-width="4"/>

  <text x="190" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#2f2f2b">Events</text>
  <text x="515" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#2f2f2b">Evidence</text>
  <text x="845" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#2f2f2b">Outcomes</text>

  <path d="M400 280 H470" stroke="#3a3a36" stroke-width="4"/>
  <path d="M730 280 H800" stroke="#3a3a36" stroke-width="4"/>

  <text x="140" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1f1f1b">Observability Logbook Pattern</text>
  <text x="140" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#4d4d46">How to review AI behavior before trust drifts</text>
</svg>
