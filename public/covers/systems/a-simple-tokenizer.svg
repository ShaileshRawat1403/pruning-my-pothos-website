<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Tokenization</title>
  <desc id="desc">Text being split into tokens with numeric encoding</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g font-family="Georgia, serif" font-size="18" fill="#1f2937">
    <text x="50" y="100">"AI is math"</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <line x1="140" y1="90" x2="180" y2="90"/>
    <polygon points="175,85 185,90 175,95" fill="#3b82f6"/>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="200" y="70" width="45" height="40" rx="4"/>
    <text x="222" y="95" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">AI</text>
    <rect x="255" y="70" width="35" height="40" rx="4"/>
    <text x="272" y="95" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">is</text>
    <rect x="300" y="70" width="55" height="40" rx="4"/>
    <text x="327" y="95" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">math</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <line x1="365" y1="90" x2="395" y2="90"/>
    <polygon points="390,85 400,90 390,95" fill="#3b82f6"/>
  </g>
  <g font-family="monospace" font-size="14" fill="#1f2937">
    <text x="50" y="145">[1045, 318, 8921]</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="195" text-anchor="middle">text → tokens → ids</text>
  </g>
</svg>