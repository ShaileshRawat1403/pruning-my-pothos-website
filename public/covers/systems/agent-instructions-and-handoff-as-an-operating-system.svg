<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Agent Instructions as OS</title>
  <desc id="desc">Instruction contract diagram with input-output gates</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="100" y="40" width="200" height="55" rx="6"/>
    <rect x="150" y="160" width="100" height="30" rx="4"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="100" y="40" width="200" height="55" rx="6"/>
    <rect x="150" y="160" width="100" height="30" rx="4"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none">
    <rect x="50" y="115" width="70" height="25" rx="4"/>
    <rect x="280" y="115" width="70" height="25" rx="4"/>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <line x1="130" y1="127" x2="120" y2="70"/>
    <line x1="270" y1="127" x2="280" y2="70"/>
    <line x1="200" y1="95" x2="200" y2="160"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="200" y="62" text-anchor="middle">instruction contract</text>
    <text x="200" y="78" text-anchor="middle" font-size="9">intent · boundaries · handoff</text>
    <text x="85" y="132" text-anchor="middle">input</text>
    <text x="315" y="132" text-anchor="middle">output</text>
    <text x="200" y="180" text-anchor="middle">memory · handoff state</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="215" text-anchor="middle">contracts · gates · state transfer</text>
  </g>
</svg>