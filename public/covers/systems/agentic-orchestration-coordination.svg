<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Orchestration</title>
  <desc id="desc">Multi-agent coordination diagram with handoff paths</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="160" y="25" width="80" height="30" rx="4"/>
    <rect x="60" y="95" width="70" height="30" rx="4"/>
    <rect x="165" y="95" width="70" height="30" rx="4"/>
    <rect x="270" y="95" width="70" height="30" rx="4"/>
    <rect x="165" y="165" width="70" height="30" rx="4"/>
    <line x1="200" y1="55" x2="120" y2="95"/>
    <line x1="200" y1="55" x2="200" y2="95"/>
    <line x1="200" y1="55" x2="280" y2="95"/>
    <line x1="200" y1="125" x2="200" y2="165"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="160" y="25" width="80" height="30" rx="4"/>
    <rect x="60" y="95" width="70" height="30" rx="4"/>
    <rect x="165" y="95" width="70" height="30" rx="4"/>
    <rect x="270" y="95" width="70" height="30" rx="4"/>
    <rect x="165" y="165" width="70" height="30" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">
    <text x="200" y="43" text-anchor="middle">orchestrator</text>
    <text x="95" y="113" text-anchor="middle">agent A</text>
    <text x="200" y="113" text-anchor="middle">agent B</text>
    <text x="305" y="113" text-anchor="middle">agent C</text>
    <text x="200" y="183" text-anchor="middle">verifier</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="215" text-anchor="middle">coordination · handoff · verification</text>
  </g>
</svg>