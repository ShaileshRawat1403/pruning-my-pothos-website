<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Agents vs Workflows</title>
  <desc id="desc">Comparison of autonomous vs controlled systems</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="60" y="55" width="110" height="75" rx="6"/>
    <rect x="230" y="55" width="110" height="75" rx="6"/>
    <line x1="170" y1="92" x2="230" y2="92"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="60" y="55" width="110" height="75" rx="6"/>
    <rect x="230" y="55" width="110" height="75" rx="6"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="115" cy="142" r="6"/>
    <circle cx="285" cy="142" r="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="115" y="85" text-anchor="middle">agent</text>
    <text x="115" y="100" text-anchor="middle" font-size="9">autonomous</text>
    <text x="115" y="113" text-anchor="middle" font-size="9">decisions</text>
    <text x="285" y="85" text-anchor="middle">workflow</text>
    <text x="285" y="100" text-anchor="middle" font-size="9">controlled</text>
    <text x="285" y="113" text-anchor="middle" font-size="9">paths</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">autonomy vs control</text>
  </g>
</svg>