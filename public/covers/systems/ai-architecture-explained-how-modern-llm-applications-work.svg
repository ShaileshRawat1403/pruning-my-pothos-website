<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">AI Architecture</title>
  <desc id="desc">Layered architecture diagram showing stacked components</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="100" y="35" width="200" height="30" rx="4"/>
    <rect x="100" y="75" width="200" height="30" rx="4"/>
    <rect x="100" y="115" width="200" height="30" rx="4"/>
    <rect x="100" y="155" width="200" height="30" rx="4"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="100" y="35" width="200" height="30" rx="4"/>
    <rect x="100" y="75" width="200" height="30" rx="4"/>
    <rect x="100" y="115" width="200" height="30" rx="4"/>
    <rect x="100" y="155" width="200" height="30" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="200" y="55" text-anchor="middle">interface layer</text>
    <text x="200" y="95" text-anchor="middle">orchestration layer</text>
    <text x="200" y="135" text-anchor="middle">retrieval layer</text>
    <text x="200" y="175" text-anchor="middle">model layer</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">layers of abstraction</text>
  </g>
</svg>