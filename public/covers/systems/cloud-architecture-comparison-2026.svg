<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Architecture 2026</title>
  <desc id="desc">Cloud comparison diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="50" y="65" width="80" height="55" rx="4"/>
    <rect x="160" y="65" width="80" height="55" rx="4"/>
    <rect x="270" y="65" width="80" height="55" rx="4"/>
    <rect x="120" y="140" width="160" height="30" rx="4"/>
    <line x1="90" y1="120" x2="200" y2="140"/>
    <line x1="200" y1="120" x2="200" y2="140"/>
    <line x1="310" y1="120" x2="200" y2="140"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="50" y="65" width="80" height="55" rx="4"/>
    <rect x="160" y="65" width="80" height="55" rx="4"/>
    <rect x="270" y="65" width="80" height="55" rx="4"/>
    <rect x="120" y="140" width="160" height="30" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="90" y="98" text-anchor="middle">AWS</text>
    <text x="200" y="98" text-anchor="middle">Azure</text>
    <text x="310" y="98" text-anchor="middle">GCP</text>
    <text x="200" y="160" text-anchor="middle">five-layer lens</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">AI era architecture choice</text>
  </g>
</svg>