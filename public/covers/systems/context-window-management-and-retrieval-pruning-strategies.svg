<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Context Window Pruning</title>
  <desc id="desc">Visual representation of retrieval filtering and context window pruning</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <!-- Context Window Pruning Group -->
  <g transform="translate(40, 40)">
    <!-- Raw Data Corpus -->
    <rect x="0" y="30" width="80" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Full Corpus</text>
    <text x="40" y="70" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">100k+ tokens</text>

    <!-- Arrow to Pruning Gate -->
    <path d="M 90 60 H 130" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="125,56 133,60 125,64" fill="#94a3b8"/>

    <!-- Semantic Pruner -->
    <rect x="140" y="20" width="80" height="80" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="180" y="52" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#7e22ce" text-anchor="middle">Pruning Gate</text>
    <text x="180" y="70" font-family="monospace" font-size="9" fill="#6b21a8" text-anchor="middle">Re-ranking</text>
    <text x="180" y="82" font-family="monospace" font-size="8" fill="#6b21a8" text-anchor="middle">[-85% Token]</text>

    <!-- Arrow to Bounded Window -->
    <path d="M 230 60 H 270" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="265,56 273,60 265,64" fill="#94a3b8"/>

    <!-- Bounded Context Window -->
    <rect x="280" y="30" width="80" height="60" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="320" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Context Window</text>
    <text x="320" y="70" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">~15k tokens</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="195" text-anchor="middle">large corpus → semantic prune → bounded context</text>
  </g>
</svg>
