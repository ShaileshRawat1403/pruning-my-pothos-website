<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Context Windows</title>
  <desc id="desc">Container representing limited context capacity with content inside</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="100" y="50" width="200" height="120" rx="8"/>
  </g>
  <g fill="#d1d5db">
    <rect x="110" y="60" width="180" height="100" rx="4"/>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#9ca3af">
    <text x="200" y="85" text-anchor="middle">prior context...</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#1f2937">
    <text x="200" y="115" text-anchor="middle">current input</text>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#d1d5db">
    <text x="200" y="145" text-anchor="middle">...remaining capacity</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">finite capacity · selective attention · cost</text>
  </g>
</svg>