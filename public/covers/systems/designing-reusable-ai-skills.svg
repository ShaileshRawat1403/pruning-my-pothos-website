<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Reusable AI Skills</title>
  <desc id="desc">Skill component with input-output contracts</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="120" y="50" width="160" height="70" rx="8"/>
    <rect x="170" y="140" width="60" height="25" rx="4"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="120" y="50" width="160" height="70" rx="8"/>
    <rect x="170" y="140" width="60" height="25" rx="4"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none">
    <rect x="40" y="70" width="60" height="25" rx="4"/>
    <rect x="300" y="70" width="60" height="25" rx="4"/>
    <line x1="100" y1="82" x2="120" y2="82"/>
    <line x1="280" y1="82" x2="300" y2="82"/>
    <line x1="200" y1="120" x2="200" y2="140"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="200" y="75" text-anchor="middle">input contract</text>
    <text x="200" y="100" text-anchor="middle" font-size="12">skill</text>
    <text x="200" y="115" text-anchor="middle" font-size="9">output contract</text>
    <text x="70" y="87" text-anchor="middle">tools</text>
    <text x="330" y="87" text-anchor="middle">limits</text>
    <text x="200" y="158" text-anchor="middle">escalate</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="195" text-anchor="middle">boundaries · contracts · escalation</text>
  </g>
</svg>