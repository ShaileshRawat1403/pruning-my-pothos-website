<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Drift Decay Failure</title>
  <desc id="desc">Degradation curve showing performance decline over time</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <path d="M50,80 Q150,85 200,100 T350,160"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
    <path d="M200,100 Q250,110 280,130"/>
  </g>
  <g stroke="#ef4444" stroke-width="1.5" fill="none">
    <path d="M280,130 Q310,145 350,160"/>
  </g>
  <g fill="#10b981">
    <circle cx="80" cy="82" r="6"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="240" cy="118" r="6"/>
  </g>
  <g fill="#ef4444">
    <circle cx="320" cy="155" r="6"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1" fill="none">
    <line x1="50" y1="180" x2="350" y2="180"/>
    <line x1="50" y1="60" x2="50" y2="180"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">quiet degradation before collapse</text>
  </g>
</svg>