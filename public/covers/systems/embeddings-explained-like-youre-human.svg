<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Embeddings Explained</title>
  <desc id="desc">Vector space visualization showing semantic clustering of points</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g fill="#3b82f6" opacity="0.6">
    <circle cx="100" cy="80" r="6"/>
    <circle cx="115" cy="95" r="6"/>
    <circle cx="90" cy="100" r="6"/>
    <circle cx="108" cy="75" r="6"/>
  </g>
  <g fill="#10b981" opacity="0.6">
    <circle cx="300" cy="70" r="6"/>
    <circle cx="285" cy="85" r="6"/>
    <circle cx="315" cy="90" r="6"/>
    <circle cx="295" cy="100" r="6"/>
  </g>
  <g fill="#f59e0b" opacity="0.6">
    <circle cx="200" cy="150" r="6"/>
    <circle cx="220" cy="140" r="6"/>
    <circle cx="185" cy="165" r="6"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <rect x="60" y="50" width="280" height="125" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">similarity in vector space</text>
  </g>
</svg>