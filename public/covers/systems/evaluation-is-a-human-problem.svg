<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation Is Human</title>
  <desc id="desc">Human judgment vs benchmarks</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="60" y="60" width="100" height="75" rx="6"/>
    <rect x="240" y="60" width="100" height="75" rx="6"/>
    <line x1="160" y1="97" x2="240" y2="97"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="60" y="60" width="100" height="75" rx="6"/>
    <rect x="240" y="60" width="100" height="75" rx="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="110" y="90" text-anchor="middle">benchmarks</text>
    <text x="110" y="105" text-anchor="middle" font-size="9">not enough</text>
    <text x="290" y="90" text-anchor="middle">judgment</text>
    <text x="290" y="105" text-anchor="middle" font-size="9">defines quality</text>
    <text x="200" y="160" text-anchor="middle" font-size="14">≠</text>
  </g>
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="60" y1="155" x2="340" y2="155"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">what matters vs what measures</text>
  </g>
</svg>