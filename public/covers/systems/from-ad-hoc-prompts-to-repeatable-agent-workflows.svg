<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">From Ad-Hoc to Repeatable</title>
  <desc id="desc">Workflow improvement journey</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="50" y="65" width="90" height="60" rx="6"/>
    <rect x="175" y="65" width="90" height="60" rx="6"/>
    <rect x="300" y="65" width="60" height="60" rx="6"/>
    <line x1="140" y1="95" x2="175" y2="95"/>
    <line x1="265" y1="95" x2="300" y2="95"/>
    <polygon points="170,90 180,95 170,100" fill="#3b82f6"/>
    <polygon points="295,90 305,95 295,100" fill="#3b82f6"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="175" y="65" width="90" height="60" rx="6"/>
    <rect x="300" y="65" width="60" height="60" rx="6"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none">
    <rect x="50" y="65" width="90" height="60" rx="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="95" y="90" text-anchor="middle">ad-hoc</text>
    <text x="95" y="105" text-anchor="middle" font-size="9">prompts</text>
    <text x="220" y="90" text-anchor="middle">structured</text>
    <text x="220" y="105" text-anchor="middle" font-size="9">instructions</text>
    <text x="330" y="90" text-anchor="middle">repeatable</text>
    <text x="330" y="105" text-anchor="middle" font-size="9">workflow</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="170" text-anchor="middle">instructions + handoff + quality gates</text>
  </g>
</svg>