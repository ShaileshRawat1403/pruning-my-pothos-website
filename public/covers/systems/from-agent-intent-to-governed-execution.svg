<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">From Intent to Execution</title>
  <desc id="desc">Governed execution pipeline</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="40" y="85" width="65" height="40" rx="4"/>
    <rect x="125" y="85" width="65" height="40" rx="4"/>
    <rect x="210" y="85" width="65" height="40" rx="4"/>
    <rect x="295" y="85" width="65" height="40" rx="4"/>
    <line x1="105" y1="105" x2="125" y2="105"/>
    <line x1="190" y1="105" x2="210" y2="105"/>
    <line x1="275" y1="105" x2="295" y2="105"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="40" y="85" width="65" height="40" rx="4"/>
    <rect x="125" y="85" width="65" height="40" rx="4"/>
    <rect x="210" y="85" width="65" height="40" rx="4"/>
    <rect x="295" y="85" width="65" height="40" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">
    <text x="72" y="110" text-anchor="middle">agent</text>
    <text x="72" y="122" text-anchor="middle">request</text>
    <text x="157" y="110" text-anchor="middle">runtime</text>
    <text x="157" y="122" text-anchor="middle">orchest.</text>
    <text x="242" y="110" text-anchor="middle">policy</text>
    <text x="242" y="122" text-anchor="middle">gates</text>
    <text x="327" y="110" text-anchor="middle">controlled</text>
    <text x="327" y="122" text-anchor="middle">behavior</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="165" text-anchor="middle">orchestration → gates → trace</text>
  </g>
</svg>