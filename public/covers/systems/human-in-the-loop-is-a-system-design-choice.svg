<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Human in the Loop</title>
  <desc id="desc">Decision gate with human oversight</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="160" y="35" width="80" height="35" rx="17"/>
    <rect x="50" y="90" width="90" height="45" rx="6"/>
    <rect x="260" y="90" width="90" height="45" rx="6"/>
    <rect x="160" y="160" width="80" height="35" rx="6"/>
    <line x1="200" y1="70" x2="95" y2="90"/>
    <line x1="200" y1="70" x2="305" y2="90"/>
    <line x1="95" y1="135" x2="200" y2="160"/>
    <line x1="305" y1="135" x2="200" y2="160"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="160" y="35" width="80" height="35" rx="17"/>
    <rect x="50" y="90" width="90" height="45" rx="6"/>
    <rect x="260" y="90" width="90" height="45" rx="6"/>
    <rect x="160" y="160" width="80" height="35" rx="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="200" y="58" text-anchor="middle">agent</text>
    <text x="95" y="118" text-anchor="middle">human</text>
    <text x="95" y="130" text-anchor="middle">oversight</text>
    <text x="305" y="118" text-anchor="middle">proceed</text>
    <text x="305" y="130" text-anchor="middle">/block</text>
    <text x="200" y="183" text-anchor="middle">decision</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="215" text-anchor="middle">design decision · not safety blanket</text>
  </g>
</svg>