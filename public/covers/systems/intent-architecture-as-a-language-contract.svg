<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Intent Architecture</title>
  <desc id="desc">Intent to execution pipeline</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="40" y="85" width="70" height="45" rx="6"/>
    <rect x="165" y="85" width="70" height="45" rx="6"/>
    <rect x="290" y="85" width="70" height="45" rx="6"/>
    <line x1="110" y1="107" x2="165" y2="107"/>
    <line x1="235" y1="107" x2="290" y2="107"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="40" y="85" width="70" height="45" rx="6"/>
    <rect x="165" y="85" width="70" height="45" rx="6"/>
    <rect x="290" y="85" width="70" height="45" rx="6"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="40" y1="145" x2="360" y2="145"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="75" y="113" text-anchor="middle">intent</text>
    <text x="200" y="113" text-anchor="middle">language</text>
    <text x="200" y="125" text-anchor="middle" font-size="9">contract</text>
    <text x="325" y="113" text-anchor="middle">execution</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">explicit contracts over implicit understanding</text>
  </g>
</svg>