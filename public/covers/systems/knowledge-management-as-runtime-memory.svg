<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge as Memory</title>
  <desc id="desc">Dynamic knowledge management system</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="155" y="50" width="90" height="45" rx="6"/>
    <rect x="155" y="155" width="90" height="35" rx="4"/>
    <line x1="200" y1="95" x2="200" y2="155"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="155" y="50" width="90" height="45" rx="6"/>
    <rect x="155" y="155" width="90" height="35" rx="4"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none">
    <rect x="50" y="115" width="70" height="30" rx="4"/>
    <rect x="280" y="115" width="70" height="30" rx="4"/>
    <line x1="120" y1="130" x2="155" y2="90"/>
    <line x1="280" y1="130" x2="245" y2="90"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="200" y="78" text-anchor="middle">knowledge</text>
    <text x="200" y="90" text-anchor="middle">base</text>
    <text x="85" y="135" text-anchor="middle">archive</text>
    <text x="315" y="135" text-anchor="middle">runtime</text>
    <text x="200" y="178" text-anchor="middle">live memory</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">not static · live system</text>
  </g>
</svg>