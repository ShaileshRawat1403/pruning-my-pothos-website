<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Natural Language as API</title>
  <desc id="desc">Natural language interface diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="50" y="70" width="100" height="50" rx="8"/>
    <rect x="250" y="70" width="100" height="50" rx="8"/>
    <line x1="150" y1="95" x2="250" y2="95"/>
    <polygon points="245,90 255,95 245,100" fill="#3b82f6"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="50" y="70" width="100" height="50" rx="8"/>
    <rect x="250" y="70" width="100" height="50" rx="8"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="50" y1="140" x2="350" y2="140"/>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#6b7280">
    <text x="100" y="100" text-anchor="middle">natural</text>
    <text x="100" y="112" text-anchor="middle">language</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="100" y="165" text-anchor="middle">intent</text>
    <text x="200" y="165" text-anchor="middle" fill="#3b82f6">translation</text>
    <text x="300" y="165" text-anchor="middle">action</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">interface for behavior · not just conversation</text>
  </g>
</svg>