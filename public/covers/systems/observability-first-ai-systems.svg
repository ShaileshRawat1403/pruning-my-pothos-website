<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Observability First</title>
  <desc id="desc">Signal and monitoring diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="50" y="65" width="70" height="40" rx="4"/>
    <rect x="280" y="65" width="70" height="40" rx="4"/>
    <rect x="165" y="130" width="70" height="35" rx="4"/>
    <line x1="120" y1="85" x2="280" y2="85"/>
    <line x1="200" y1="105" x2="200" y2="130"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="50" y="65" width="70" height="40" rx="4"/>
    <rect x="280" y="65" width="70" height="40" rx="4"/>
    <rect x="165" y="130" width="70" height="35" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="85" y="90" text-anchor="middle">model</text>
    <text x="85" y="102" text-anchor="middle">output</text>
    <text x="315" y="90" text-anchor="middle">product</text>
    <text x="315" y="102" text-anchor="middle">behavior</text>
    <text x="200" y="153" text-anchor="middle">observe</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">missing layer in production</text>
  </g>
</svg>