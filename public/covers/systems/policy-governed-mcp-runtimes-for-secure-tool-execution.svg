<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Policy-Governed MCP Runtimes</title>
  <desc id="desc">Model Context Protocol runtime intercepting tool executions via policy checks</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <!-- MCP Gating Architecture Group -->
  <g transform="translate(40, 40)">
    <!-- Client/Model -->
    <rect x="0" y="30" width="80" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Agent/LLM</text>
    <text x="40" y="75" font-family="monospace" font-size="8" fill="#60a5fa" text-anchor="middle">calls tool</text>

    <!-- Request Arrow -->
    <path d="M 90 60 H 130" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="125,56 133,60 125,64" fill="#94a3b8"/>

    <!-- Policy Filter Gate -->
    <rect x="140" y="20" width="80" height="80" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="180" y="52" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#be123c" text-anchor="middle">Policy Gate</text>
    <text x="180" y="70" font-family="monospace" font-size="9" fill="#9f1239" text-anchor="middle">Verify: Scope</text>
    <text x="180" y="82" font-family="monospace" font-size="8" fill="#9f1239" text-anchor="middle">[Strict]</text>

    <!-- Success Output Arrow -->
    <path d="M 230 60 H 270" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="265,56 273,60 265,64" fill="#10b981"/>

    <!-- Secure MCP Server -->
    <rect x="280" y="30" width="80" height="60" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="320" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">MCP Server</text>
    <text x="320" y="75" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">Execution</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="195" text-anchor="middle">call request → policy check → server execution</text>
  </g>
</svg>
