<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Probabilities Not Truth</title>
  <desc id="desc">Distribution curve showing confidence levels across possible outputs</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g fill="#3b82f6" opacity="0.15">
    <path d="M50,180 Q100,40 200,50 Q300,60 350,180 Z"/>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <path d="M50,180 Q100,40 200,50 Q300,60 350,180"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="200" cy="50" r="5"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1" fill="none">
    <line x1="50" y1="180" x2="350" y2="180"/>
    <line x1="200" y1="40" x2="200" y2="190" stroke-dasharray="4 3"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">confidence distribution</text>
  </g>
</svg>