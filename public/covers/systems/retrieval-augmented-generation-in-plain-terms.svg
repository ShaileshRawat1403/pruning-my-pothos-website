<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">RAG</title>
  <desc id="desc">Retrieval pipeline showing query to grounded response</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="40" y="60" width="70" height="35" rx="4"/>
    <rect x="165" y="60" width="70" height="35" rx="4"/>
    <rect x="290" y="60" width="70" height="35" rx="4"/>
    <rect x="165" y="130" width="70" height="35" rx="4"/>
    <line x1="110" y1="77" x2="165" y2="77"/>
    <line x1="235" y1="77" x2="290" y2="77"/>
    <line x1="200" y1="95" x2="200" y2="130"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="165" y="60" width="70" height="35" rx="4"/>
    <rect x="165" y="130" width="70" height="35" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="75" y="82" text-anchor="middle">query</text>
    <text x="200" y="82" text-anchor="middle">vector search</text>
    <text x="325" y="82" text-anchor="middle">context</text>
    <text x="200" y="152" text-anchor="middle">generate</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="215" text-anchor="middle">retrieve → ground → generate</text>
  </g>
</svg>