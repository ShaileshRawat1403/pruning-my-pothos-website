    <rect x="270" y="65" width="80" height="35" rx="4"/>
    <rect x="160" y="125" width="80" height="35" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="90" y="88" text-anchor="middle">define</text>
    <text x="200" y="88" text-anchor="middle">detect</text>
    <text x="310" y="88" text-anchor="middle">version</text>
    <text x="200" y="148" text-anchor="middle">rollback?</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="195" text-anchor="middle">expected behavior · regression · safe rollout</text>
  </g>
</svg>