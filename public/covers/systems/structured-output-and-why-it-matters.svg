<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Structured Output</title>
  <desc id="desc">JSON structure diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="70" y="55" width="260" height="100" rx="4"/>
  </g>
  <g fill="#3b82f6" opacity="0.1">
    <rect x="70" y="55" width="260" height="100" rx="4"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#1f2937">
    <text x="90" y="80">{</text>
    <text x="110" y="80" fill="#3b82f6">"status"</text>
    <text x="180" y="80">:</text>
    <text x="195" y="80" fill="#10b981">"success"</text>
    <text x="280" y="80">,</text>
    <text x="110" y="100" fill="#3b82f6">"data"</text>
    <text x="160" y="100">:</text>
    <text x="175" y="100" fill="#f59e0b">{ ... }</text>
    <text x="90" y="125">}</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="185" text-anchor="middle">format enables trust</text>
  </g>
</svg>