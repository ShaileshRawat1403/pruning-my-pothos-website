<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Intelligence Assembly Model</title>
  <desc id="desc">Assembly diagram showing components connecting to a central processor</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <circle cx="200" cy="112" r="45"/>
    <line x1="115" y1="75" x2="165" y2="95"/>
    <line x1="285" y1="75" x2="235" y2="95"/>
    <line x1="115" y1="150" x2="165" y2="130"/>
    <line x1="285" y1="150" x2="235" y2="130"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <circle cx="200" cy="112" r="45"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="200" cy="112" r="15"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none">
    <circle cx="90" cy="60" r="20"/>
    <circle cx="310" cy="60" r="20"/>
    <circle cx="90" cy="165" r="20"/>
    <circle cx="310" cy="165" r="20"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">
    <text x="90" y="63" text-anchor="middle">model</text>
    <text x="310" y="63" text-anchor="middle">memory</text>
    <text x="90" y="168" text-anchor="middle">tools</text>
    <text x="310" y="168" text-anchor="middle">policy</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">model + memory + tools + policy + feedback</text>
  </g>
</svg>