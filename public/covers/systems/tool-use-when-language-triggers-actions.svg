<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Tool Use</title>
  <desc id="desc">Language triggering action diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="50" y="85" width="90" height="50" rx="6"/>
    <rect x="260" y="70" width="90" height="80" rx="6"/>
    <line x1="140" y1="110" x2="260" y2="110"/>
    <polygon points="255,105 265,110 255,115" fill="#3b82f6"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="50" y="85" width="90" height="50" rx="6"/>
    <rect x="260" y="70" width="90" height="80" rx="6"/>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#6b7280">
    <text x="95" y="115" text-anchor="middle">language</text>
    <text x="95" y="128" text-anchor="middle">intent</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="305" y="105" text-anchor="middle">action</text>
    <text x="305" y="118" text-anchor="middle">system</text>
    <text x="305" y="138" text-anchor="middle" font-size="9" fill="#9ca3af">guardrails required</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">execution changes accountability</text>
  </g>
</svg>