<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Training vs Inference</title>
  <desc id="desc">Training and inference lifecycle diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="40" y="65" width="90" height="45" rx="6"/>
    <rect x="270" y="65" width="90" height="45" rx="6"/>
    <rect x="155" y="140" width="90" height="45" rx="6"/>
    <line x1="130" y1="87" x2="200" y2="100"/>
    <line x1="270" y1="87" x2="200" y2="100"/>
    <line x1="90" y1="110" x2="200" y2="140"/>
    <line x1="310" y1="110" x2="200" y2="140"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="40" y="65" width="90" height="45" rx="6"/>
    <rect x="270" y="65" width="90" height="45" rx="6"/>
    <rect x="155" y="140" width="90" height="45" rx="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="85" y="93" text-anchor="middle">training</text>
    <text x="85" y="105" text-anchor="middle" font-size="8">once · expensive</text>
    <text x="315" y="93" text-anchor="middle">inference</text>
    <text x="315" y="105" text-anchor="middle" font-size="8">often · operational</text>
    <text x="200" y="168" text-anchor="middle">fine-tuning</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">where business value lives</text>
  </g>
</svg>