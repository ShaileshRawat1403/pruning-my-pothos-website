<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-labelledby="title desc">
  <title id="title">Skill What Is</title>
  <desc id="desc">Skill as execution unit diagram</desc>
  <rect width="400" height="225" fill="#f9fafb"/>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none">
    <rect x="100" y="65" width="70" height="30" rx="4"/>
    <rect x="155" y="95" width="90" height="50" rx="8"/>
    <rect x="230" y="65" width="70" height="30" rx="4"/>
    <line x1="170" y1="80" x2="165" y2="105"/>
    <line x1="245" y1="105" x2="300" y2="80"/>
    <line x1="200" y1="145" x2="200" y2="175"/>
  </g>
  <g fill="#3b82f6" opacity="0.15">
    <rect x="155" y="95" width="90" height="50" rx="8"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1.5" fill="none">
    <rect x="100" y="65" width="70" height="30" rx="4"/>
    <rect x="230" y="65" width="70" height="30" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">
    <text x="135" y="85" text-anchor="middle">prompt</text>
    <text x="200" y="125" text-anchor="middle">skill</text>
    <text x="265" y="85" text-anchor="middle">workflow</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
    <text x="200" y="210" text-anchor="middle">between prompt and workflow</text>
  </g>
</svg>