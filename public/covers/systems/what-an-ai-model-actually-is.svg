    <circle cx="60" cy="155" r="8"/>
    <circle cx="140" cy="50" r="10"/>
    <circle cx="140" cy="95" r="10"/>
    <circle cx="140" cy="130" r="10"/>
    <circle cx="140" cy="175" r="10"/>
    <circle cx="260" cy="80" r="12"/>
    <circle cx="260" cy="145" r="12"/>
    <circle cx="340" cy="112" r="16"/>
    <line x1="68" y1="70" x2="130" y2="50"/>
    <line x1="68" y1="70" x2="130" y2="95"/>
    <line x1="68" y1="112" x2="130" y2="95"/>
    <line x1="68" y1="112" x2="130" y2="130"/>
    <line x1="68" y1="155" x2="130" y2="130"/>
    <line x1="68" y1="155" x2="130" y2="175"/>
