    <line x1="272" y1="80" x2="324" y2="112"/>
    <line x1="272" y1="145" x2="324" y2="112"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="340" cy="112" r="5"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">
