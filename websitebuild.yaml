pipeline:
  name: pruning-my-pothos-deploy
  identifier: pruning_my_pothos_deploy
  projectIdentifier: demopipelineobservability
  orgIdentifier: default
  stages:
    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: pruningmypothos
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      type: DockerRegistry
                      spec:
                        connectorRef: ghcr_pruning_my_pothos
                        imagePath: shaileshrawat1403/pruning-my-pothos-website
                        tag: <+input.parameters.imageTag> # Placeholder for image tag
                  manifests:
                    - manifest:
                        identifier: k8s_manifest
                        type: K8sManifest
                        spec:
                          store:
                            type: Inline
                            spec:
                              content: |-
                                apiVersion: v1
                                kind: Namespace
                                metadata:
                                  name: {{ .Values.namespace }} # Placeholder for namespace
                                ---
                                apiVersion: apps/v1
                                kind: Deployment
                                metadata:
                                  name: pruning-my-pothos
                                  namespace: {{ .Values.namespace }} # Placeholder for namespace
                                spec:
                                  replicas: 1
                                  selector:
                                    matchLabels:
                                      app: pruning-my-pothos
                                  template:
                                    metadata:
                                      labels:
                                        app: pruning-my-pothos
                                    spec:
                                      containers:
                                        - name: web
                                          image: <+artifacts.primary.image>
                                          imagePullPolicy: Always
                                          ports:
                                            - containerPort: 80
                                          resources: # Added resource limits and requests
                                            requests:
                                              cpu: "100m"
                                              memory: "128Mi"
                                            limits:
                                              cpu: "200m"
                                              memory: "256Mi"
                                          livenessProbe: # Added liveness probe
                                            httpGet:
                                              path: /
                                              port: 80
                                            initialDelaySeconds: 15
                                            periodSeconds: 20
                                          readinessProbe: # Added readiness probe
                                            httpGet:
                                              path: /
                                              port: 80
                                            initialDelaySeconds: 5
                                            periodSeconds: 10
                                ---
                                apiVersion: v1
                                kind: Service
                                metadata:
                                  name: pruning-my-pothos
                                  namespace: {{ .Values.namespace }} # Placeholder for namespace
                                spec:
                                  selector:
                                    app: pruning-my-pothos
                                  type: LoadBalancer # Changed to LoadBalancer
                                  ports:
                                    - name: http
                                      port: 80
                                      targetPort: 80
          environment:
            environmentRef: localk8s
            infrastructureDefinitions:
              - identifier: local_dd_k8s_infra
                inputs:
                  identifier: local_dd_k8s_infra
                  type: KubernetesDirect
                  spec:
                    connectorRef: k8s_docker_desktop
                    namespace: <+input.parameters.namespace> # Placeholder for namespace
                    releaseName: pruning-my-pothos
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rollout
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec: {}
            rollbackSteps:
              - step:
                  name: Rollback
                  identifier: rollback
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
